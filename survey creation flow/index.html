<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Survey Builder — Enculture</title>
  <link rel="stylesheet" href="index.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet" />
</head>
<body data-density="compact">
  <div class="enc-main-container">
    <!-- Header -->
    <header class="enc-header">
      <div class="enc-header-brand">
        <div class="enc-logo-mark" aria-hidden="true"></div>
        <span class="enc-header-title">Survey Builder</span>
      </div>
      <div class="enc-header-actions">
        <button type="button" class="enc-action-secondary enc-action-icon" onclick="previewSurvey()">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
          Preview survey
        </button>
        <div class="enc-dropdown">
          <button type="button" class="enc-action-secondary enc-action-icon" onclick="toggleUploadMenu()">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
            Upload
          </button>
        </div>
        <button type="button" class="enc-action-primary enc-action-icon" onclick="saveSurvey()">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><polyline points="17 21 17 13 7 13 7 21"/><polyline points="7 3 7 8 15 8"/></svg>
          Save changes
        </button>
        <button type="button" class="enc-icon-button enc-icon-button-sm" aria-label="Settings">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-1.17A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h1.17A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v1.17a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-1.17a1.65 1.65 0 0 0-1.51 1z"/></svg>
        </button>
        <button type="button" class="enc-icon-button enc-icon-button-sm" aria-label="Filter">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="22 3 2 3 10 12.46 10 19 14 21 14 12.46 22 3"/></svg>
        </button>
        <div class="enc-avatar" aria-hidden="true">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><circle cx="12" cy="8" r="3"/><path d="M12 14c-3.5 0-6 2.2-6 5v1h12v-1c0-2.8-2.5-5-6-5z"/></svg>
        </div>
      </div>
    </header>

    <!-- Left sidebar: Survey Structure -->
    <aside class="enc-sidebar enc-sidebar-left">
      <h2 class="enc-section-title">Survey structure</h2>
      
      <!-- Page Settings Card (layout ref: title on line 1; "Questions per page : N" + edit icon on line 2) -->
      <div class="enc-structure-card enc-structure-card-page-settings" id="page-settings-card">
        <div class="enc-structure-card-header">
          <span>Page Settings</span>
          <button type="button" class="enc-icon-button enc-page-settings-trigger" id="page-settings-trigger" aria-label="Edit page settings" aria-expanded="false" aria-haspopup="dialog" onclick="togglePageSettingsPopover(event)">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>
          </button>
        </div>
        <div class="enc-structure-card-setting-row">
          <span class="enc-structure-meta" id="questions-per-page-meta">Questions per page : 10</span>
        </div>
        <div class="enc-popover" id="page-settings-popover" role="dialog" aria-label="Page settings" aria-hidden="true">
          <div class="enc-popover-content">
            <label class="enc-form-label" for="questions-per-page-input">Number of questions per page</label>
            <input type="number" id="questions-per-page-input" class="enc-input-field" min="1" max="50" value="10" onchange="applyQuestionsPerPage(this.value)">
            <div class="enc-popover-actions">
              <button type="button" class="enc-action-primary" onclick="applyQuestionsPerPage(document.getElementById('questions-per-page-input').value)">Apply</button>
            </div>
          </div>
        </div>
      </div>

      <!-- Survey Structure Tree -->
      <div class="enc-structure-tree" id="survey-structure">
        <!-- Rendered by JavaScript -->
      </div>
    </aside>

    <!-- Main: Edit canvas (Page / Section / Question form) -->
    <main class="enc-main">
      <div class="enc-edit-header" id="edit-header">
        <!-- Rendered by JavaScript -->
      </div>
      <div class="enc-edit-content" id="edit-question-content">
        <!-- Rendered by JavaScript -->
      </div>
    </main>

    <!-- Properties: inline right panel -->
    <aside id="properties-drawer" class="enc-sidebar enc-sidebar-right enc-properties-panel" aria-label="Question properties">
      <h2 class="enc-section-title">PROPERTIES</h2>
      <div class="enc-properties-content" id="properties-content">
        <!-- Rendered by JavaScript -->
      </div>
    </aside>
  </div>
  <script src="app.js"></script>
</body>
</html>
